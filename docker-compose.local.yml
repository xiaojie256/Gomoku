version: '3.8'  
services:  
  postgres_local:  
    image: postgres:15  
    container_name: gomoku_postgres_local  
    environment:  
      POSTGRES_USER: gomoku_user  
      POSTGRES_PASSWORD: gomoku_password  
      POSTGRES_DB: gomoku_db  
    ports:  
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # 持久化数据库数据
      
  redis_local:  
    image: redis:7-alpine  
    container_name: gomoku_redis_local  
    ports:  
      - "6385:6379"
    volumes:
      - redisdata:/data  # 持久化 Redis 数据

volumes:
  pgdata:
  redisdata:  
