version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: gomoku_postgres
    environment:
      POSTGRES_USER: gomoku_user
      POSTGRES_PASSWORD: gomoku_password
      POSTGRES_DB: gomoku_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: gomoku_redis
    volumes:
      - redisdata:/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gomoku_backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=gomoku_user
      - DB_PASSWORD=gomoku_password
      - DB_NAME=gomoku_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=gomoku_prod_secret_key_change_me
    depends_on:
      - postgres
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gomoku_frontend
    environment:
      - BACKEND_URL=http://backend:4125
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
  redisdata: